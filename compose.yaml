services:
  mysql:
    image: mysql:8.0
    container_name: ave-scanner-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --binlog-expire-logs-seconds=86400
      - --innodb-buffer-pool-size=8G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${DB_NAME:-ave_scanner}
      MYSQL_USER: ${DB_USER:-ave_scanner}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ave-scanner-mysql:/var/lib/mysql
      - ./scanner/sql/001_ave_scanner_schema.sql:/docker-entrypoint-initdb.d/001_ave_scanner_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  scan-bsc:
    image: ${SCANNER_IMAGE:-loraiscan-token-scanner:local}
    build: ./scanner
    restart: unless-stopped
